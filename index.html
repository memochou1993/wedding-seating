<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 編輯金鑰在網址上：不送 Referer，避免外部網站從來源網址看到金鑰 -->
<meta name="referrer" content="no-referrer">
<!-- 只允許自己的程式、Google Fonts，以及連線到 wedding 的 Supabase -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://jkzybhpzihljrluxslmy.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>林府文定 席次表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  /* 版面：上方花框標題 → 左平面圖、右側面板 → 下方席次一覽。配色沿用告示牌。 */
  :root {
    --ground: #f3efe8;      /* 頁面底色：帶一點香檳的灰白 */
    --paper: #fffdf9;
    --ink: #2b2522;
    --body: #4e3a2a;        /* 深咖啡：主要文字 */
    --muted: #8c7a68;
    --accent: #a8875a;      /* 香檳金：框線、花飾 */
    --accent-soft: #efe5d3;
    --line: #dccdb4;
    --parents: #e7edf1;     /* 主婚人親友桌底色 */
    --parents-ink: #4d6576;
    --couple: #f6e6e3;      /* 新人親友桌底色 */
    --couple-ink: #8a5149;
    --warn: #a3402f;
    --kid: #6f9a86;           /* 兒童座椅 */
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --latin: "Cormorant Garamond", "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 32px 16px 64px;
    background: var(--ground); color: var(--body);
    font: 16px/1.6 var(--serif);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 880px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }

  /* 花框卡片：.framed 內會插入一張依尺寸重畫的 SVG 邊框 */
  .framed { position: relative; background: var(--paper); box-shadow: 0 1px 2px rgba(78,58,42,.06), 0 10px 30px rgba(78,58,42,.07); }
  .framed > .frame-art { position: absolute; inset: 14px; width: calc(100% - 28px); height: calc(100% - 28px); pointer-events: none; color: var(--accent); overflow: visible; }

  /* 標題 */
  .hero { padding: 92px 40px 64px; text-align: center; }
  .hero .zh-kicker { font-size: 15px; letter-spacing: .6em; padding-left: .6em; color: var(--accent); font-weight: 500; }
  .hero .en-kicker { font-family: var(--latin); font-size: 13px; letter-spacing: .4em; padding-left: .4em; color: var(--accent); margin-top: 2px; }
  .hero h1 { margin: 22px 0 6px; font-size: clamp(32px, 6vw, 56px); font-weight: 700; letter-spacing: .14em; padding-left: .14em; color: var(--body); line-height: 1.25; text-wrap: balance; }
  .hero .date { font-size: 17px; letter-spacing: .12em; color: var(--body); }
  .hero .date em { display: inline-block; font-family: var(--latin); font-style: italic; font-size: 19px; color: var(--accent); letter-spacing: .04em; }
  .rule { display: flex; align-items: center; gap: 12px; width: 220px; max-width: 70%; margin: 20px auto 0; color: var(--accent); }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: currentColor; }
  .rule span { width: 7px; height: 7px; background: currentColor; transform: rotate(45deg); }

  /* 版面：手機優先的單欄。標題 → 固定在頂端的找座位列 → 平面圖 → 席次一覽；電腦上置中最寬 880px */
  @media (max-width: 560px) { body { padding: 16px 8px 48px; } .hero { padding: 72px 20px 48px; } .plan-card { padding: 104px 8px 92px; } .roster { padding: 56px 16px 40px; } }
  .plan-card { padding: 116px 22px 104px; }   /* 上下拉長，讓平面圖避開四角的花飾，左右就不必縮 */
  .plan-card svg.plan { display: block; width: 100%; height: auto; }

  /* 平面圖 */
  .plan text { font-family: var(--serif); fill: var(--body); }
  .plan .wall { fill: none; stroke: #b9a891; stroke-width: 2.4; stroke-linejoin: miter; stroke-linecap: butt; }
  .plan .door { fill: none; stroke: #b9a891; stroke-width: 1.1; }
  .plan .pillar { fill: #b9a891; }
  .plan .entrance { font-size: 15px; letter-spacing: .5em; fill: var(--accent); }
  .plan .stage { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
  .plan .stair { fill: var(--paper); stroke: #c7b394; stroke-width: 1; }
  .plan .runway { fill: #f6f0e5; stroke: #cdb894; stroke-width: 1.2; }
  .plan .label { font-size: 17px; letter-spacing: .2em; fill: var(--muted); }
  .plan .label-lg { font-size: 22px; letter-spacing: .3em; fill: var(--body); font-weight: 500; }
  .plan .hall-name { font-family: var(--latin); font-size: 15px; letter-spacing: .35em; fill: var(--accent); }

  .tbl { cursor: pointer; }
  .tbl circle.disc { fill: var(--paper); stroke: var(--accent); stroke-width: 1.6; transition: stroke-width .15s, fill .15s; }
  .tbl[data-side="主婚人親友"] circle.disc { fill: var(--parents); }
  .tbl[data-side="新人親友"] circle.disc { fill: var(--couple); }
  .tbl circle.halo { fill: none; stroke: var(--accent); stroke-width: 1; opacity: 0; }
  .tbl .chair { fill: var(--paper); stroke: var(--accent); stroke-width: 1; }
  .tbl .chair.taken { fill: var(--accent); }
  .tbl .chair.over { fill: var(--warn); stroke: var(--warn); }
  .tbl .chair.kid { fill: var(--kid); stroke: none; }
  body[data-mode="staff"] .tbl .chair.kid { cursor: grab; }
  .tbl .num { font-size: 26px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: var(--body); }
  .tbl .num.long { font-size: 16px; }
  .tbl .num.empty { fill: #c9b99f; font-weight: 500; }
  .tbl .num.with-name { font-size: 21px; }
  .tbl .num.with-name.long { font-size: 15px; }
  .tbl .tn { font-size: 9px; font-weight: 500; letter-spacing: 0; text-anchor: middle; dominant-baseline: central; fill: var(--accent); pointer-events: none; }
  .tbl.match .tn { fill: #fff; }
  /* 選取／聚焦：桌子後方一圈淡淡的香檳金光暈 */
  .tbl circle.hit { fill: transparent; }   /* 放大觸控範圍，手機上比較好點 */
  .tbl circle.glow { fill: var(--accent); opacity: 0; transition: opacity .2s; }
  .tbl:hover circle.glow { opacity: .08; }
  .tbl:focus-visible circle.glow, .tbl.selected circle.glow { opacity: .2; }
  .tbl.selected circle.disc { stroke-width: 2; }
  .tbl:focus { outline: none; }
  .tbl.match circle.disc { fill: var(--accent); stroke: var(--accent); }
  .tbl.match .num { fill: #fff; }
  .tbl.match circle.halo { opacity: 1; animation: ping 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .tbl.dup .num { fill: var(--warn); }
  /* 拖曳交換整桌（工作人員） */
  body[data-mode="staff"] .tbl { touch-action: manipulation; }
  .plan { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .tbl.lifting { opacity: .35; }
  .tbl.drop-target circle.glow { opacity: .35; }
  .tbl.drop-target circle.disc { stroke-width: 2.6; }
  .ghost { pointer-events: none; }
  .ghost circle { fill: var(--paper); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; opacity: .95; }
  .ghost text { font-size: 24px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: var(--body); }
  body.dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;
    display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 18px; background: var(--body); color: #fff; border-radius: 999px;
    box-shadow: 0 10px 30px rgba(43,37,34,.3); font-size: 14px; white-space: nowrap; max-width: calc(100% - 32px); }
  .toast button { border: 0; background: transparent; color: #f3dfb8; font: inherit; font-weight: 500; min-height: 36px; padding: 0 8px; cursor: pointer; }
  @keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(1.45); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .tbl.match circle.halo { animation: none; } }

  /* 圖例：淺色圓圈（顏色＝平面圖上桌子的底色）＋文字；圓圈用 SVG 畫才不會歪 */
  .side-tag { display: inline-flex; align-items: center; gap: 6px; letter-spacing: .06em; color: var(--muted); }
  .side-tag svg { flex: none; width: 14px; height: 14px; }
  .side-tag circle { fill: var(--paper); stroke: var(--accent); stroke-width: 1.1; }
  .side-tag .kid-icon { fill: var(--kid); }
  .side-tag[data-side="主婚人親友"] circle { fill: var(--parents); }
  .side-tag[data-side="新人親友"] circle { fill: var(--couple); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; margin-top: 22px; font-size: 13px; color: var(--muted); }

  /* 找座位列：捲動時固定在畫面頂端 */
  /* 找座位列：外面包一層和頁面同色的底（上下各留一點空），固定在頂端時後面的內容不會從縫隙透出來 */
  .bar-dock { position: sticky; top: 0; z-index: 10; padding: 10px 0; margin: -10px 0; }
  .bar-dock.stuck { background: var(--ground); }   /* 只有真的固定在頂端時才鋪底色，平常不會蓋到上一張卡片的陰影 */
  .bar-sentinel { height: 0; margin: 0; }
  .bar { position: relative; background: var(--paper); box-shadow: 0 1px 2px rgba(78,58,42,.06), 0 10px 30px rgba(78,58,42,.07); padding: 12px 16px; display: grid; gap: 6px; }   /* 和其他卡片一樣用陰影 */
  .bar-row { display: flex; align-items: center; gap: 12px; }
  .bar-label { font-size: 13px; font-weight: 500; letter-spacing: .3em; color: var(--accent); white-space: nowrap; }
  .bar input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); background: #fff; font-size: 16px; }
  .bar input:focus { border-color: var(--accent); outline: none; }
  .results { list-style: none; position: absolute; left: 12px; right: 12px; top: calc(100% - 4px); margin: 0; padding: 8px; display: grid; gap: 6px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(78,58,42,.12); max-height: 50vh; overflow: auto; }
  .results:empty, .bar:not(:focus-within) .results { display: none; }
  .results button { width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .results button:hover { border-color: var(--accent); }
  .results b { color: var(--accent); white-space: nowrap; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .hint:empty { display: none; }
  .status { margin: 0; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .status a { color: var(--accent); margin-left: auto; text-decoration: none; }
  .saved.bad { color: var(--warn); }
  body[data-mode="guest"] .staff-only, body[data-mode="guest"] .card .meter { display: none; }

  /* 底部面板：手機從下方滑出，電腦上浮在下方中央。賓客＝同桌名單（不擋畫面），工作人員＝編輯（對話框） */
  .sheet {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 20;
    width: min(560px, 100%); max-height: 85vh; max-height: 85dvh; overflow: auto; margin: 0;
    background: var(--paper); color: var(--body); border: 1px solid var(--accent); border-bottom: 0; border-radius: 16px 16px 0 0;
    box-shadow: 0 -12px 40px rgba(78,58,42,.18); padding: 14px 20px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .sheet::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
  @media (min-width: 600px) { .sheet { bottom: 24px; border-bottom: 1px solid var(--accent); border-radius: 6px; } .sheet::before { display: none; } }
  dialog.sheet { max-width: none; inset: auto auto 0 50%; }
  /* 電腦上編輯面板放在畫面正中央 */
  @media (min-width: 600px) { dialog.sheet { inset: 50% auto auto 50%; transform: translate(-50%, -50%); } }
  dialog.sheet:focus { outline: none; }
  /* 面板分成 頂部（標題、×）｜可捲動的內容｜底部（上一桌／下一桌），× 與按鈕永遠看得到 */
  #detail:not([hidden]), dialog.sheet[open] { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
  .sheet::before { margin: 10px auto 2px; flex: none; }
  .sheet-head { position: relative; flex: none; padding: 6px 20px 12px; border-bottom: 1px solid var(--line); }
  .sheet-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 4px 20px 18px; }
  #detail .sheet-body { padding: 8px 20px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .sheet-foot { flex: none; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--paper); }
  .sheet-foot.nav { margin-top: 0; }
  .sheet-head .close { top: 0; right: 8px; }
  @media (min-width: 600px) { .sheet::before { display: none; } .sheet-head { padding-top: 16px; } .sheet-foot { padding-bottom: 14px; } #detail .sheet-body { padding-top: 18px; } }
  dialog.sheet::backdrop { background: rgba(43,37,34,.35); }
  .sheet h2 { margin: 0 0 4px; font-size: 12px; font-weight: 500; letter-spacing: .4em; color: var(--accent); }
  .sheet h2 small { font-family: var(--latin); letter-spacing: .25em; margin-left: 8px; }
  .close { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border: 0; background: transparent; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer; }

  .detail-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-right: 40px; }
  .detail-head .big { font-size: 32px; font-weight: 700; color: var(--body); line-height: 1.2; }
  .chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip[data-side="主婚人親友"] { background: var(--parents); color: var(--parents-ink); border-color: transparent; }
  .chip[data-side="新人親友"] { background: var(--couple); color: var(--couple-ink); border-color: transparent; }
  .chip.over { border-color: var(--warn); color: var(--warn); }
  /* 賓客點桌子浮出的資訊卡：置中的座位卡樣式 */
  .place { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 4px; }
  .place .eyebrow { font-family: var(--latin); font-size: 12px; letter-spacing: .4em; padding-left: .4em; color: var(--accent); }
  .place .n { font-family: var(--latin); font-size: 52px; font-weight: 600; line-height: 1; color: var(--body); margin-top: 2px; }
  .place .n:not(:empty) { font-variant-numeric: lining-nums; }
  .place .mini-rule { display: flex; align-items: center; gap: 6px; width: 72px; margin: 12px 0 10px; color: var(--accent); }
  .place .mini-rule::before, .place .mini-rule::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .7; }
  .place .mini-rule i { width: 5px; height: 5px; background: currentColor; transform: rotate(45deg); }
  .place .tname { font-size: 15px; letter-spacing: .12em; color: var(--accent); margin: 0 0 10px; }

  /* 編輯面板 */
  .field-label { font-size: 13px; color: var(--muted); letter-spacing: .1em; margin: 16px 0 6px; }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); background: #fff; }
  .seg button { border: 0; border-left: 1px solid var(--line); background: transparent; min-height: 44px; padding: 6px 4px; cursor: pointer; font-size: 15px; color: var(--body); }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button[aria-pressed="true"][data-v="主婚人親友"] { background: var(--parents-ink); }
  .seg button[aria-pressed="true"][data-v="新人親友"] { background: var(--couple-ink); }
  .guest-list { list-style: none; margin: 0; padding: 0; counter-reset: g; border-top: 1px solid var(--line); }
  .guest-list li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); counter-increment: g; }
  .guest-list li::before { content: counter(g); width: 1.6em; text-align: right; font-family: var(--latin); color: var(--muted); font-size: 14px; }
  .guest-list li.over::before { color: var(--warn); }
  .guest-list input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 4px; font-size: 16px; color: var(--body); }
  .guest-list input:focus { outline: none; background: var(--accent-soft); }
  .g-count { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); }
  .g-count input { width: 3.2em; padding: 8px 4px; border: 1px solid var(--line); background: #fff; text-align: center; font-size: 16px; color: var(--body); font-variant-numeric: lining-nums tabular-nums; }
  .g-count input:focus { border-color: var(--accent); outline: none; background: #fff; }
  .guest-list .g-count input { flex: none; }
  .add .g-count input { padding: 10px 4px; }
  .g-count.kid { font-size: 12px; }
  .g-count.kid input { width: 2.6em; }
  .g-count.kid.on input { border-color: var(--kid); color: var(--kid); font-weight: 600; }
  .kid-n { margin-left: 6px; font-size: .8em; color: var(--kid); }
  .party-n { margin-left: 6px; font-size: .8em; color: var(--muted); font-variant-numeric: lining-nums; }
  .guest-list .del { width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; flex: none; }
  .guest-list:empty { display: none; }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); background: #fff; font-size: 16px; }
  .add input:focus { border-color: var(--accent); outline: none; }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
  .muted { color: var(--muted); font-size: 12px; }
  .text-input { display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: #fff; font-size: 16px; color: var(--body); }
  .text-input:focus { border-color: var(--accent); outline: none; }
  .field-label { display: block; }
  /* 出席名單（待安排）：點一下就加入這一桌 */
  .combo { position: relative; }
  .combo-pop { display: none; margin-top: -1px; border: 1px solid var(--accent); background: #fff; box-shadow: 0 10px 24px rgba(78,58,42,.12); }
  .combo:focus-within .combo-pop { display: block; }
  .combo:focus-within .text-input { border-color: var(--accent); }
  .combo-filter { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); }
  .combo-filter button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--body); cursor: pointer; min-height: 32px; }
  .combo-filter button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pool-list { list-style: none; margin: 0; padding: 0; max-height: 45vh; max-height: 45dvh; overflow: auto; }
  .pool-list button.active { background: var(--accent-soft); }
  .pool-list button { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 9px 10px; cursor: pointer; color: var(--body); font-size: 16px; }
  .pool-list button:hover { background: var(--accent-soft); }
  .pool-list .who-line { flex: 1; min-width: 0; }
  .pool-list .meta { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pool-list .meta .warn { color: var(--warn); }
  .pool-list .party { flex: none; font-size: 13px; font-variant-numeric: lining-nums; color: var(--accent); border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; }
  .pool-list .plus { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-size: 16px; }
  .pool-list .empty { padding: 12px 10px; color: var(--muted); font-size: 14px; }
  .btn { border: 1px solid var(--accent); background: transparent; color: var(--body); min-height: 44px; padding: 8px 16px; cursor: pointer; letter-spacing: .1em; font-size: 15px; }
  .btn:hover { background: var(--accent-soft); }
  .btn.solid { background: var(--accent); color: #fff; }

  /* 席次一覽 */
  .roster { padding: 72px 40px 52px; }
  .roster-head { text-align: center; margin-bottom: 26px; }
  .roster-head h2 { margin: 0; font-size: 24px; letter-spacing: .5em; padding-left: .5em; font-weight: 700; color: var(--body); }
  .roster-head p { margin: 2px 0 0; font-family: var(--latin); font-size: 13px; letter-spacing: .4em; color: var(--accent); }
  .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  /* 席次一覽：像婚宴的座位卡——TABLE、大號桌號、細線菱形、桌名，名單置中往下排 */
  .card { position: relative; border: 1px solid var(--line); padding: 16px 12px 16px; cursor: pointer; background: #fff; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; }   /* <button> 預設垂直置中，改成置頂 */
  .card:hover { border-color: var(--accent); }
  .card .eyebrow { font-family: var(--latin); font-size: 11px; letter-spacing: .4em; padding-left: .4em; color: var(--accent); }
  .card .n { font-family: var(--latin); font-size: 40px; font-weight: 600; line-height: 1; color: var(--body); margin-top: 2px; font-variant-numeric: lining-nums; }
  .card .mini-rule { display: flex; align-items: center; gap: 6px; width: 64px; margin: 10px 0 8px; color: var(--accent); }
  .card .mini-rule::before, .card .mini-rule::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .7; }
  .card .mini-rule i { width: 5px; height: 5px; background: currentColor; transform: rotate(45deg); }
  .card .tname { font-size: 14px; letter-spacing: .12em; color: var(--accent); margin: 0 0 8px; }
  .card .who { font-size: 15px; color: var(--body); line-height: 1.9; }
  .card .who.none { color: #c2b39c; font-size: 14px; }
  /* 姓名｜人數 兩欄對齊 */
  .party-grid { display: grid; grid-template-columns: auto auto; justify-content: center; align-items: baseline; column-gap: 12px; text-align: left; }
  .party-grid .ct { text-align: right; color: var(--muted); font-size: .85em; white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
  .party-grid .kid-n { font-style: normal; display: block; font-size: .9em; line-height: 1.2; }
  .names-grid { justify-content: stretch; grid-template-columns: 1fr auto; column-gap: 14px; margin-top: 4px; }   /* 一列一組，長名字也不會擠 */
  .names-grid .nm, .names-grid .ct { padding: 7px 0; border-bottom: 1px dotted var(--line); font-size: 16px; }
  .names-grid .ct { font-size: 14px; }
  /* 座位條 */
  .card .meter { display: flex; gap: 4px; margin-top: auto; padding-top: 12px; }
  .meter i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--accent); }
  .meter i.on { background: var(--accent); }
  .meter i.over { background: var(--warn); border-color: var(--warn); }

  [hidden] { display: none !important; }

  /* ───── 輸出版海報：尺寸由 --pw/--ph 決定（預設 A2 橫式 594×420mm），字級跟著紙張等比放大 ───── */
  body.poster-mode { padding: 0; background: #d9d4cc; overflow: auto; }
  body.poster-mode .wrap { display: none; }
  body.poster-mode:not(.board-mode) .sheet, body.poster-mode:not(.board-mode) .toast { display: none !important; }
  .poster-stage { transform-origin: 0 0; }
  .poster-stage { position: relative; width: 0; }
  body.board-mode .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 15; display: flex; align-items: center; gap: 8px 20px; padding: 8px 20px; }
  body.board-mode .bar-row { flex: 0 0 380px; }
  body.board-mode .bar .hint { display: none; }
  body.board-mode .status { flex: 1; font-size: 13px; }
  /* 編輯面板靠右，平面圖保持看得到 */
  body.board-mode dialog.sheet { inset: auto 24px 24px auto; transform: none; height: calc(100vh - 110px); max-height: none; width: 480px; }
  body.board-mode dialog.sheet::backdrop { background: rgba(43,37,34,.12); }
  body.board-mode .p-list .card { cursor: pointer; }
  body.board-mode .p-list .card:hover { border-color: var(--accent); }

  .poster {
    --k: calc(var(--ph) / 420mm);   /* 相對 A2 的倍率 */
    width: var(--pw); height: var(--ph); box-sizing: border-box; background: var(--paper);
    padding: calc(34mm * var(--k)) calc(30mm * var(--k)) calc(28mm * var(--k)) calc(36mm * var(--k)); display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr;
    column-gap: calc(14mm * var(--k)); row-gap: calc(5mm * var(--k)); box-shadow: none;
  }
  .poster > .frame-art { inset: calc(8mm * var(--k)); width: calc(100% - 16mm * var(--k)); height: calc(100% - 16mm * var(--k)); }
  .p-plan { grid-row: 1 / 3; height: calc(var(--ph) - 62mm * var(--k)); aspect-ratio: 752 / 1232; }
  .p-plan svg.plan { width: 100%; height: 100%; }
  .p-head { text-align: center; padding-top: calc(2mm * var(--k)); }
  .p-kicker { font-size: calc(5mm * var(--k)); letter-spacing: .6em; color: var(--accent); }
  .p-kicker span { display: block; font-family: var(--latin); font-size: .7em; letter-spacing: .4em; margin-top: .3em; }
  .p-head h1 { margin: calc(2mm * var(--k)) 0 calc(1mm * var(--k)); font-size: calc(13mm * var(--k)); letter-spacing: .14em; color: var(--body); line-height: 1.15; }
  .p-date { font-size: calc(5mm * var(--k)); letter-spacing: .1em; }
  .p-date em { font-family: var(--latin); font-style: italic; color: var(--accent); margin-left: 1em; }
  .p-list { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); gap: calc(3mm * var(--k)); min-height: 0; }
  /* 海報的桌卡：桌號與桌名同一行，下方細線，名單往下排，省下高度給名單 */
  .p-list .card { cursor: default; padding: calc(2.6mm * var(--k)) calc(2.6mm * var(--k)); overflow: hidden; min-height: 0;
    display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr; align-content: start; align-items: center; column-gap: calc(2.2mm * var(--k)); text-align: left; }
  .p-list .card .eyebrow, .p-list .card .mini-rule { display: none; }
  .p-list .card .n { grid-column: 1; line-height: 1.15; margin: 0; }
  /* 桌號與桌名同一行、同字級、同字體、基線對齊；字級依整行字寬放到最大（上限 5.6mm），不折行 */
  .p-list .card .tname { grid-column: 2; margin: 0; letter-spacing: 0; line-height: 1.15; white-space: nowrap; overflow: hidden; color: var(--body); }
  .p-list .card .n, .p-list .card .tname { font-family: var(--serif); font-size: min(calc(5.6mm * var(--k)), calc(33mm * var(--k) / var(--hw, 6))); }
  .p-list .card .n { font-weight: 700; font-variant-numeric: lining-nums; }
  .p-list .card .tname { font-weight: 500; }
  .p-list .card { align-items: baseline; }
  .p-list .card .who { grid-column: 1 / -1; align-self: start; font-size: calc(3.1mm * var(--k)); line-height: 1.4;
    border-top: 1px solid var(--accent-soft); margin-top: calc(1.8mm * var(--k)); padding-top: calc(1.6mm * var(--k)); }
  /* 名字太長就截成「…」，不折行，免得把後面的人擠出卡片 */
  .p-list .party-grid { grid-template-columns: minmax(0, max-content) auto; max-width: 100%; }
  .p-list .party-grid .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-list .kid-n { display: none; }   /* 兒童座椅看平面圖上的綠色方塊就好 */
  /* 超過 7 組：名單改成兩欄，10 組也放得下 */
  .p-list .card.many .party-grid { grid-template-columns: repeat(2, minmax(0, max-content) auto); column-gap: calc(1.6mm * var(--k)); font-size: calc(2.9mm * var(--k)); }
  .p-list .card .who.none { font-size: calc(2.8mm * var(--k)); text-align: center; }
  .p-list .card .meter { display: none; }
  .p-list .note { border: 1px solid var(--line); background: #fff; padding: calc(3mm * var(--k)); display: flex; flex-direction: column; justify-content: center; gap: calc(2mm * var(--k)); font-size: calc(3mm * var(--k)); color: var(--muted); }
  .p-list .note .side-tag { gap: calc(2mm * var(--k)); }
  .p-list .note .side-tag svg { width: calc(3.6mm * var(--k)); height: calc(3.6mm * var(--k)); }
  .p-list .note b { color: var(--body); font-weight: 500; font-size: 1.05em; }
  .p-list .note .url { font-family: var(--latin); font-size: .95em; color: var(--accent); word-break: break-all; }

  @media print {

    body { background: #fff; padding: 0; }

    .framed { box-shadow: none; }

</style>
</head>
<body>

  <!-- 輸出版（?poster，預設 A2 橫式）：左邊平面圖、右邊 7×6 席次表；用瀏覽器列印或 tools/poster.sh 存成 PDF -->
  <section class="poster framed" id="poster" data-frame-scale="1.8" hidden>

    <header class="p-head">

      <h1>聖雅典｜威尼斯</h1>

</div>

<script>
/* ───────────── 會場幾何（依會場平面圖描繪，單位 = 110dpi 像素）───────────── */
/*
 * 桌位：依 PDF 的交錯排列重新排齊。每桌連椅子的佔地半徑 SEAT，
 * 與牆、伸展台保持 GAP 的走道；同一區兩欄左右錯開半排。
 */
const TABLE_R = 30, SEAT = 37;            // 桌面半徑、連椅子的佔地半徑（桌面放大，桌名可放 6 個字）
const PITCH = 150, ROW_A = 380, ROW_B = ROW_A + PITCH / 2;
const rowsA = [0, 1, 2, 3, 4].map(k => ROW_A + k * PITCH);
const rowsB = [0, 1, 2, 3, 4].map(k => ROW_B + k * PITCH);
// 區塊邊界：左牆 90｜伸展台 250–300｜伸展台 622–672｜右牆 832（以 x=461 左右鏡像）
const GAP = 20;
const COLS = [
  [90 + GAP + SEAT, rowsA], [250 - GAP - SEAT, rowsB],                    // 聖雅典 靠牆區
  [300 + GAP + SEAT, rowsA], [300 + GAP + SEAT + 50, rowsB],              // 中央區 左
  [622 - GAP - SEAT - 50, rowsB], [622 - GAP - SEAT, rowsA],              // 中央區 右
  [672 + GAP + SEAT, rowsB], [832 - GAP - SEAT, rowsA.concat(ROW_A + 5 * PITCH)],  // 威尼斯 靠牆區（最後一欄多一桌）
];
const SPOTS = COLS.flatMap(([x, ys]) => ys.map(y => [x, y]));
// 依「由前往後、由左往右」排序，作為預設桌號順序
const row = ([, y]) => Math.round((y - ROW_A) / (PITCH / 2));
// 主桌放在兩座舞台、兩條伸展台的正中線（x≈461），不是外牆的中線（外牆左右本來就不對稱）
const TABLES = [{ id: "main", x: 461, y: 290, r: 35, seat: 45, main: true }].concat(
  SPOTS.slice().sort((a, b) => row(a) - row(b) || a[0] - b[0]).map(([x, y], i) => ({ id: "t" + (i + 1), x, y, r: TABLE_R, seat: SEAT }))
);
// 桌號：由舞台往入口、由中間往兩側。最靠近主桌的兩區先編，每區都沿交錯的兩欄由上往下：
// 中左 1–10 → 中右 11–20 → 左區 21–30 → 右區 31–41。號碼越小越靠前、越靠中間。
// 桌子的 id（t1…t41）綁在位置上、存檔也用 id，這裡只決定「哪個位置是幾號」。
const ZONES = [[300, 461, "down"], [461, 622, "down"], [0, 250, "down"], [672, 840, "down"]];
const SNAKE = ZONES.flatMap(([x0, x1, dir]) => TABLES.filter(t => !t.main && t.x > x0 && t.x < x1)
  .sort((a, b) => dir === "down" ? a.y - b.y : b.y - a.y));
const NUM_OF = Object.fromEntries([["main", "主桌"], ...SNAKE.map((t, i) => [t.id, String(i + 1)])]);
const ORDER = ["main", ...SNAKE.map(t => t.id)];
// 兒童座椅放在離走道最遠的那一側：每區兩欄之間是桌子彼此相對的內側，走道在牆邊、伸展台邊與中央。
// 所以往「所在區塊的中線」那一側放；主桌朝舞台那一側。
const ZONE_MID = [[0, 250, 170], [300, 461, 382], [461, 622, 540], [672, 840, 752]];
function awayFromAisle(t) {
  if (t.main) return -Math.PI / 2;
  const z = ZONE_MID.find(([x0, x1]) => t.x > x0 && t.x < x1);
  return t.x < z[2] ? 0 : Math.PI;
}
const angDist = (a, b) => { const d = Math.abs(a - b) % (2 * Math.PI); return d > Math.PI ? 2 * Math.PI - d : d; };
// 桌名分行：以字寬計（中文 1、英數 0.55），一行最多約 5 個中文字寬；
// 有空白就在空白處斷（「合作夥伴 1」），否則從中間平均斷（「揪咪團／家人們」）；第二行太長用「…」
const nameWidth = (str) => [...str].reduce((n, c) => n + (/[\x00-\x7f]/.test(c) ? 0.55 : 1), 0);
function tableNameLines(name) {
  name = (name || "").trim();
  if (!name) return [];
  const w = nameWidth;
  const MAX = 6.05;   // 一行最多 6 個中文字
  if (w(name) <= MAX) return [name];
  const chars = [...name];
  let a, b;
  const sp = name.indexOf(" ");
  if (sp > 0 && w(name.slice(0, sp)) <= MAX) { a = name.slice(0, sp); b = name.slice(sp + 1).trim(); }
  else {
    let cut = 1, best = Infinity;   // 讓兩行寬度最接近
    for (let i = 1; i < chars.length; i++) { const d = Math.abs(w(chars.slice(0, i).join("")) - w(chars.slice(i).join(""))); if (d < best && w(chars.slice(0, i).join("")) <= MAX) { best = d; cut = i; } }
    a = chars.slice(0, cut).join(""); b = chars.slice(cut).join("");
  }
  while (w(b) > MAX - 0.6) b = [...b].slice(0, -1).join("");
  if (b !== name.slice(name.length - b.length) && !name.endsWith(b)) b += "…";
  return [a, b];
}
const seatCount = (d) => Math.max(d.cap, seatsOf(d));
const slotAngle = (k, n) => -Math.PI / 2 + (k + 0.5) * 2 * Math.PI / n;
// 兒童座椅在哪幾個椅位：先照工作人員拖過的角度（kidAngles）找最近的椅位，不夠的再自動補在離走道最遠處
function kidSlots(t, d) {
  const n = seatCount(d), kids = Math.min(n, d.guests.reduce((c, p) => c + (p.child || 0), 0)), chosen = new Set();
  const nearest = (target) => Array.from({ length: n }, (_, k) => k).filter(k => !chosen.has(k))
    .sort((a, b) => angDist(slotAngle(a, n), target) - angDist(slotAngle(b, n), target))[0];
  for (const deg of (d.kidAngles || []).slice(0, kids)) chosen.add(nearest(deg * Math.PI / 180));
  while (chosen.size < kids) chosen.add(nearest(awayFromAisle(t)));
  return chosen;
}

function toParty(g) {
  if (typeof g === "string") {
    const m = g.match(/^(.*?)\s*[+＋]\s*(\d+)$/);
    g = m ? { name: m[1], count: 1 + +m[2] } : { name: g, count: 1 };
  }
  if (!g || typeof g !== "object" || typeof g.name !== "string" || !g.name.trim()) return null;
  const count = Math.min(20, Math.max(1, Math.round(+g.count) || 1));
  const child = Math.min(count, Math.max(0, Math.round(+g.child) || 0));
  return child ? { name: g.name.trim().slice(0, 20), count, child } : { name: g.name.trim().slice(0, 20), count };
}

function frameSVG(W, H) {
  const CX = W / 2;
  const ln = (w) => `fill="none" stroke="currentColor" stroke-width="${w}" vector-effect="non-scaling-stroke"`;
  const dot = `fill="currentColor"`;
  const diamond = (x, y, r) => `<path d="M${x},${y - r} L${x + r},${y} L${x},${y + r} L${x - r},${y} Z" ${dot}/>`;
  const leaf = (x, y, ang, len, wid) => `<path d="M0,0 Q${len / 2},${-wid} ${len},0 Q${len / 2},${wid} 0,0 Z" transform="translate(${x},${y}) rotate(${ang})" ${dot}/>`;
  const four = (g) => ["", `translate(${W},0) scale(-1,1)`, `translate(0,${H}) scale(1,-1)`, `translate(${W},${H}) scale(-1,-1)`].map(t => `<g transform="${t}">${g}</g>`).join("");
  const diag = (g) => `<g>${g}</g><g transform="matrix(0,1,1,0,0,0)">${g}</g>`;
  const scaleAt = (k, x, y, g) => `<g transform="translate(${x},${y}) scale(${k}) translate(${-x},${-y})">${g}</g>`;
  const I = 3.2, R = 19;
  const notch = `<path d="M${I + R},${I} H${W - I - R} A${R},${R} 0 0 0 ${W - I},${I + R} V${H - I - R} A${R},${R} 0 0 0 ${W - I - R},${H - I} H${I + R} A${R},${R} 0 0 0 ${I},${H - I - R} V${I + R} A${R},${R} 0 0 0 ${I + R},${I} Z" ${ln(1.2)}/>`;
  const i = I / 1.25, r = 15, a = r * 0.62;
  const corner = scaleAt(1.25, 0, 0,
    diag(`<path d="M${i},${i + r + 1} c4,0 6.5,2.5 6.5,6.5 c0,2.6 -2.6,3.4 -3.8,1.7 c-0.8,-1.2 0.2,-2.5 1.4,-2" ${ln(0.9)}/>`) +
    `<path d="M${i},${i + a} A${a},${a} 0 0 0 ${i + a},${i}" ${ln(0.6)}/>` + diamond(i + a * 0.42, i + a * 0.42, 1.3));
  const arm = (s) =>
    `<path d="M${CX},10 C${CX + s * 6},10 ${CX + s * 8},4.5 ${CX + s * 14},4.8 C${CX + s * 22},5.2 ${CX + s * 23},12.5 ${CX + s * 30},11.5 C${CX + s * 35},10.8 ${CX + s * 35.5},5.6 ${CX + s * 31.5},6 C${CX + s * 29},6.3 ${CX + s * 29.5},9 ${CX + s * 31.5},8.8" ${ln(1.1)}/>` +
    `<path d="M${CX + s * 3},13.5 C${CX + s * 9},14.5 ${CX + s * 12},17.5 ${CX + s * 17},16 c${s * 2.6},-0.8 ${s * 2.2},-3.6 0,-3.4" ${ln(0.8)}/>` +
    leaf(CX + s * 18.5, 7.2, s > 0 ? -20 : 200, 6, 1.5);
  const crest = scaleAt(1.25, CX, 0, arm(1) + arm(-1) + diamond(CX, 7, 2.8) + `<circle cx="${CX}" cy="13" r="1.2" ${dot}/>`);
  const curl = (s) => `<path d="M${CX + s * 4},4 C${CX + s * 10},4 ${CX + s * 12},8 ${CX + s * 17},7 C${CX + s * 20.5},6.2 ${CX + s * 20},2.8 ${CX + s * 17.5},3.4" ${ln(0.9)}/>`;
  const foot = `<g transform="translate(0,${H}) scale(1,-1)">${diamond(CX, 4, 2.4) + curl(1) + curl(-1)}</g>`;
  return `<rect x="0" y="0" width="${W}" height="${H}" ${ln(1)}/>` + notch + four(corner) + crest + foot;
}
function decorate(el) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.classList.add("frame-art");
  el.prepend(svg);

    const W = w / u, H = h / u;

      const cls = mode !== "staff" ? "chair" : k >= d.cap && taken ? "chair over" : taken ? "chair taken" : "chair";
      return `<circle class="${cls}" cx="${cx}" cy="${cy}" r="3.6"/>`;
    }).join("");
    g.dataset.side = d.side;
    g.classList.toggle("selected", g.dataset.id === selected);
    g.classList.toggle("dup", mode === "staff" && dups.has(d.num));
    g.classList.toggle("match", !!q && (d.guests.some(p => p.name.includes(q)) || d.name.includes(q)));
    g.setAttribute("aria-label", `${label(d)}${d.name ? "・" + d.name : ""}，${d.side || "未設定"}，${used} 位賓客`);
  }
}

function renderDetail() {

// 編輯區塊：工作人員點了桌子才出現；桌號依平面圖固定，不能手動改
function renderEditor() {

function renderStats() {
  const ts = ORDER.map(id => state.tables[id]);

function renderRoster() {
  const ids = ORDER.filter(id => id !== "main").sort(   // 席次一覽不列主桌

function renderSearch() {
  const q = query.trim(), list = $("results");
  if (!q) { list.innerHTML = ""; $("search-hint").textContent = mode === "staff" ? (matchMedia("(pointer: coarse)").matches ? "點桌子編輯名單；長按桌子再拖到另一桌，可整桌交換。" : "點桌子編輯名單；把桌子拖到另一桌上，可整桌交換。") : ""; return; }
  const hits = [];

// 點選項時先擋掉 mousedown，輸入框才不會失焦、選單也不會收起，可以連續加好幾組
$("combo").addEventListener("mousedown", (e) => { if (e.target.closest("button")) e.preventDefault(); });
$("pool-list").addEventListener("click", (e) => { const b = e.target.closest("button[data-name]"); if (b) addFromPool(b.dataset.name); });
$("pool-q").addEventListener("focus", () => { $("pool-q").setAttribute("aria-expanded", "true"); poolActive = -1; renderPool(); });
$("pool-q").addEventListener("blur", () => $("pool-q").setAttribute("aria-expanded", "false"));
$("pool-q").addEventListener("keydown", (e) => {

const step = (k) => { const i = ORDER.indexOf(selected); document.activeElement.blur(); select(ORDER[(i + k + ORDER.length) % ORDER.length], true); };
$("close-editor").onclick = () => $("editor").close();
$("editor").addEventListener("close", () => { if (selected) select(null, true); });
// 點面板外面（變暗的背景）就關閉；按下與放開都在外面才算，避免在面板裡拖選文字時誤關

let downOutside = false;
$("editor").addEventListener("pointerdown", (e) => { downOutside = e.target === $("editor") && outside($("editor"), e); });
$("editor").addEventListener("click", (e) => { if (downOutside && e.target === $("editor") && outside($("editor"), e)) $("editor").close(); downOutside = false; });
// 賓客的同桌名單：點頁面其他地方就收起（點別桌則直接換成那一桌）
document.addEventListener("click", (e) => {

/* ───────────── 拖曳交換整桌（工作人員）─────────────
 * 桌號、人數上限留在原位；桌名、歸屬、賓客整包互換。
 * 滑鼠：按住移動超過 5px 就開始拖；手機：長按 0.35 秒再拖（避免和捲動衝突）。 */
let justDragged = false, drag = null, toastTimer = null;
const SWAP_KEYS = ["name", "side", "guests"];
function svgPoint(e) { const p = plan.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(plan.getScreenCTM().inverse()); }
function tableAt(pt) {
  let best = null, bestD = Infinity;
  for (const t of TABLES) { const d = Math.hypot(t.x - pt.x, t.y - pt.y); if (d < t.seat + 14 && d < bestD) { best = t; bestD = d; } }
  return best;
}
function swapTables(a, b) {
  const A = state.tables[a], B = state.tables[b];
  for (const k of SWAP_KEYS) [A[k], B[k]] = [B[k], A[k]];
  A.kidAngles = []; B.kidAngles = [];   // 換了位置，兒童座椅重新自動擺到離走道最遠處
  save([a, b]); renderAll();
}
function showToast(text, undo) {
  $("toast-text").textContent = text; $("toast").hidden = false;
  $("toast-undo").onclick = () => { undo(); $("toast").hidden = true; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").hidden = true, 6000);
}
function startDrag() {
  drag.active = true;
  document.body.classList.add("dragging");
  if (drag.kind === "kid") { navigator.vibrate?.(15); return; }
  drag.g.classList.add("lifting");
  const t = TABLES.find(x => x.id === drag.id);
  drag.ghost = document.createElementNS(NS, "g");
  drag.ghost.classList.add("ghost");
  drag.ghost.innerHTML = `<circle r="${t.seat}"/><text y="-2">${esc(state.tables[drag.id].num)}</text>`;
  plan.append(drag.ghost);
  navigator.vibrate?.(15);
  moveDrag(drag.last);
}
function moveDrag(e) {
  const pt = svgPoint(e);
  if (drag.kind === "kid") {   // 兒童座椅：沿著桌邊轉到最近的椅位
    const t = TABLES.find(x => x.id === drag.id), d = state.tables[drag.id], n = seatCount(d);
    const a = Math.atan2(pt.y - t.y, pt.x - t.x);
    const to = Array.from({ length: n }, (_, k) => k).sort((x, y) => angDist(slotAngle(x, n), a) - angDist(slotAngle(y, n), a))[0];
    if (to !== drag.slot) {
      const slots = [...kidSlots(t, d)];
      const i = slots.indexOf(drag.slot), j = slots.indexOf(to);
      if (j >= 0) slots[j] = drag.slot;   // 拖到另一張兒童座椅上就互換
      slots[i] = to;
      d.kidAngles = slots.map(k => Math.round(slotAngle(k, n) * 180 / Math.PI));
      drag.slot = to;
      renderPlan();
    }
    return;
  }
  drag.ghost.setAttribute("transform", `translate(${pt.x},${pt.y})`);
  const over = tableAt(pt), target = over && over.id !== drag.id ? over.id : null;
  if (target !== drag.target) {
    plan.querySelector(".tbl.drop-target")?.classList.remove("drop-target");
    if (target) plan.querySelector(`.tbl[data-id="${target}"]`).classList.add("drop-target");
    drag.target = target;
  }
  drag.edge = e.clientY < 70 ? -1 : e.clientY > innerHeight - 70 ? 1 : 0;   // 靠近畫面上下緣時自動捲動
}
function autoScroll() {
  if (!drag) return;
  if (drag.active && drag.edge) { scrollBy(0, drag.edge * 12); moveDrag(drag.last); }
  requestAnimationFrame(autoScroll);
}
function endDrag(drop) {
  if (!drag) return;
  clearTimeout(drag.timer);
  if (drag.active && drag.kind === "kid") {
    justDragged = true; setTimeout(() => justDragged = false, 0);
    document.body.classList.remove("dragging");
    const id = drag.id, before = drag.before, d = state.tables[id];
    if (!drop) { d.kidAngles = before; renderPlan(); }
    else if (JSON.stringify(before) !== JSON.stringify(d.kidAngles)) {
      save([id]);
      showToast(`已移動${label(d)}的兒童座椅`, () => { d.kidAngles = before; save([id]); renderPlan(); });
    }
  } else if (drag.active) {
    justDragged = true; setTimeout(() => justDragged = false, 0);
    drag.ghost.remove();
    drag.g.classList.remove("lifting");
    plan.querySelector(".tbl.drop-target")?.classList.remove("drop-target");
    document.body.classList.remove("dragging");
    const a = drag.id, b = drag.target;
    if (drop && b) {
      swapTables(a, b);
      showToast(`已交換${label(state.tables[a])}與${label(state.tables[b])}`, () => swapTables(a, b));
    }
  }
  drag = null;
}
plan.addEventListener("pointerdown", (e) => {
  if (mode !== "staff" || e.button > 0) return;
  const g = e.target.closest(".tbl"); if (!g) return;
  drag = { id: g.dataset.id, g, x: e.clientX, y: e.clientY, last: e, active: false, target: null, edge: 0, touch: e.pointerType !== "mouse" };
  const kid = e.target.closest(".chair.kid");   // 按在兒童座椅上 → 拖的是兒童座椅，不是整桌
  if (kid) Object.assign(drag, { kind: "kid", slot: +kid.dataset.slot, before: [...(state.tables[drag.id].kidAngles || [])] });
  if (drag.touch) drag.timer = setTimeout(() => drag && startDrag(), 350);
  requestAnimationFrame(autoScroll);
});
addEventListener("pointermove", (e) => {
  if (!drag) return;
  drag.last = e;
  const moved = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
  if (!drag.active) {
    if (drag.touch && moved > 8) { clearTimeout(drag.timer); drag = null; }   // 手指在長按前就移動 → 是在捲動，不拖
    else if (!drag.touch && moved > 5) startDrag();
    return;
  }
  moveDrag(e);
});
addEventListener("touchmove", (e) => { if (drag?.active) e.preventDefault(); }, { passive: false });   // 拖曳中不要捲動頁面
addEventListener("contextmenu", (e) => { if (drag) e.preventDefault(); });                            // 長按不要跳出系統選單
addEventListener("pointerup", () => endDrag(true));
addEventListener("pointercancel", () => endDrag(false));
addEventListener("keydown", (e) => { if (e.key === "Escape" && drag) endDrag(false); });

/* ───────────── 輸出版（?poster=a2｜a1｜a3，預設 A2 橫式）───────────── */
const POSTER = new URLSearchParams(location.search).get("poster");
const PAPER = { a1: [841, 594], a2: [594, 420], a3: [420, 297] };
// 桌機的工作人員版也用這個版面當編輯畫面（BOARD）：上方找座位列，下方整張海報縮放到剛好塞滿視窗
const BOARD = STAFF && !POSTER && matchMedia("(min-width: 1100px)").matches;
function setupPoster() {
  const [pw, ph] = PAPER[(POSTER || "a2").toLowerCase()] || PAPER.a2;
  document.body.classList.add("poster-mode");
  if (BOARD) document.body.classList.add("board-mode");
  const poster = $("poster");
  poster.style.setProperty("--pw", pw + "mm"); poster.style.setProperty("--ph", ph + "mm");
  poster.hidden = false;
  $("p-plan").append(plan);                 // 同一張平面圖搬進海報
  const stage = document.createElement("div"); stage.className = "poster-stage";
  document.body.prepend(stage); stage.append(poster);   // 移出 .wrap（海報模式會把 .wrap 藏起來）
  const bar = document.querySelector(".bar");
  if (BOARD) {
    document.body.prepend(bar);                                  // 找座位與同步狀態留在最上方
    document.body.append($("editor"), $("toast"), $("detail"));  // 對話框也移出被藏起來的 .wrap
  }
  document.head.insertAdjacentHTML("beforeend", `<style>@media print { @page { size: ${pw}mm ${ph}mm; margin: 0; } body.poster-mode { background: none; } .poster-stage { transform: none !important; } .bar { display: none !important; } }</style>`);
  const fit = () => {
    const top = BOARD ? bar.offsetHeight + 16 : 16;
    // 編輯畫面以寬度為準（字比較大，可往下捲）；預覽／列印則整張塞進視窗
    const k = BOARD ? (innerWidth - 32) / poster.offsetWidth : Math.min((innerWidth - 32) / poster.offsetWidth, (innerHeight - top - 16) / poster.offsetHeight, 1);
    stage.style.transform = `translate(${(innerWidth - poster.offsetWidth * k) / 2}px, ${top}px) scale(${k})`;
    stage.style.height = (top + poster.offsetHeight * k + 16) + "px";
  };
  addEventListener("resize", fit); requestAnimationFrame(fit); document.fonts?.ready.then(fit);
  // 點右邊的桌卡＝點平面圖上那一桌
  $("p-list").addEventListener("click", (e) => { const c = e.target.closest(".card[data-id]"); if (c) select(c.dataset.id, true); });
}
// 海報右邊的 7×6 格：41 桌＋最後一格放圖例與網址
function renderPosterList() {
  if (!POSTER && !BOARD) return;
  $("p-list").innerHTML = $("roster").innerHTML + `<div class="note">
    <span class="side-tag" data-side="主婚人親友"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.25"/></svg>主婚人親友</span>
    <span class="side-tag" data-side="新人親友"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.25"/></svg>新人親友</span>
    <span class="side-tag"><svg viewBox="0 0 14 14" aria-hidden="true"><rect class="kid-icon" x="2.5" y="2.5" width="9" height="9" rx="1.2"/></svg>兒童座椅</span>
    <span><b>手機找座位</b><br><span class="url">memochou1993.github.io/wedding-seating</span></span></div>`;
}
if (POSTER) { mode = "guest"; setupPoster(); }
else if (BOARD) setupPoster();

buildPlan();
setMode(mode);
(async () => {
  if (STAFF) { try { canSync = await rpc("seating_check_key", { p_event: EVENT, p_key: EDIT_KEY }); } catch (e) { offline = true; } }
  await pull();
  setInterval(() => { push(); pull(); }, STAFF ? 15000 : 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
})();
</script>
</body>
